# Course-style lenient config. Three checks are switched off on purpose:
#  - no-server-example.com : we use api.example.com until Meeting 3 (real server)
#  - operation-4xx-response: GET /lockers only needs 200 this week
#  - security-defined      : auth (keys/permissions) is Chapter 4, not now
rules:
  no-server-example.com: off
  operation-4xx-response: off
  security-defined: off
  operation-summary: warn
  no-empty-servers: off
  tag-description: off
  info-license: off
